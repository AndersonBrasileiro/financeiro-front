<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ERP Finanças</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- 📱 MENU SUPERIOR EXCLUSIVO PARA CELULAR (Aparece apenas em telas pequenas) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark d-lg-none">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">🚀 Finanças ERP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuCelular">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuCelular">
                <div class="navbar-nav pt-2">
                    <div class="text-muted small px-3 py-1 text-uppercase">Operações</div>
                    <a class="nav-link" href="pagar.html">📄 A Pagar</a>
                    <a class="nav-link" href="receber.html">💰 A Receber</a>
                    <a class="nav-link" href="extrato.html">📋 Extrato Interno</a>
                    <a class="nav-link" href="transferencia.html">💸 Transferência</a>
                    <hr class="dropdown-divider bg-light">
                    <button id="btnSairCelular" class="btn btn-danger btn-sm m-3">Sair</button>
                </div>
            </div>
        </nav>

    <!-- 💻 BARRA LATERAL ESTILO SUPABASE (Aparece apenas em computadores) -->
    <div class="sidebar-supabase">
        <div class="py-4 px-4 text-white fw-bold border-bottom border-secondary" style="font-size: 1.2rem;">
            🚀 <span class="ms-2">ERP</span>
        </div>
        <div class="pt-3">
            <!-- Grupo de Operações Agrupadas -->
            <div class="sidebar-heading">Operações</div>
            
            <a href="pagar.html" class="nav-sidebar-link">
                <span class="menu-icon">📄</span>
                <span class="menu-text">Contas a Pagar</span>
            </a>
            <a href="receber.html" class="nav-sidebar-link">
                <span class="menu-icon">💰</span>
                <span class="menu-text">Contas a Receber</span>
            </a>
            <a href="extrato.html" class="nav-sidebar-link">
                <span class="menu-icon">📋</span>
                <span class="menu-text">Extrato Interno</span>
            </a>
            <a href="transferencia.html" class="nav-sidebar-link">
                <span class="menu-icon">💸</span>
                <span class="menu-text">Transferências</span>
            </a>
            
            <div class="border-top border-secondary mt-4 pt-3">
                <a href="#" id="btnSair" class="nav-sidebar-link text-danger">
                    <span class="menu-icon">🚪</span>
                    <span class="menu-text">Sair do Sistema</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 📦 ÁREA DE CONTEÚDO PRINCIPAL (Wrapper fluido) -->
    <div class="content-wrapper">
        <div class="container-fluid">
            <!-- Mantenha aqui dentro todo o miolo do seu dashboard atual (Cards de saldo, tabelas, etc.) -->
            <div class="row mb-4">
                <div class="col">
                    <h2 class="fw-bold text-dark">Painel de Controle</h2>
                    <p class="text-muted">Bem-vindo de volta! Aqui está o resumo das suas finanças online.</p>
                </div>
            </div>
            
            <!-- (Cole aqui o restante dos seus cards de saldo anteriores para não perdê-los) -->
            
        </div>
    </div>

    <script src="config.js"></script>
    <!-- Adicionado o JS do Bootstrap para fazer o menu hambúrguer funcionar no celular -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // Vincula a função de sair para os dois botões (computador e celular)
        const logout = () => {
            localStorage.removeItem('token_financas');
            window.location.href = 'index.html';
        };
        document.getElementById('btnSair')?.addEventListener('click', logout);
        document.getElementById('btnSairCelular')?.addEventListener('click', logout);
    </script>
</body>
</html>
