<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato de Movimentações - ERP Finanças</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Menu de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">🚀 Finanças ERP</a>
            <div class="d-flex">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <button id="btnSair" class="btn btn-danger btn-sm">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row mb-3">
            <div class="col">
                <h2 class="fw-bold text-dark">📋 Extrato Interno de Movimentações</h2>
                <p class="text-muted">Histórico consolidado de todas as entradas e saídas geradas por baixas.</p>
            </div>
        </div>

        <!-- Painel de Filtro -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-6 col-12 mb-3 mb-md-0">
                        <label for="selectContaFiltro" class="form-label fw-bold small text-muted">Filtrar por Conta Bancária</label>
                        <select id="selectContaFiltro" class="form-select">
                            <option value="">-- Todas as Contas --</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-12 text-md-end">
                        <button id="btnFiltrar" class="btn btn-primary px-4">Filtrar Histórico</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Extrato -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 15%;">Data Mov.</th>
                                <th style="width: 45%;">Descrição / Origem</th>
                                <th style="width: 15%;">Conta</th>
                                <th style="width: 10%;">Tipo</th>
                                <th style="width: 15%;" class="text-end">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaExtrato">
                            <!-- Injetado via Javascript -->
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Carregando movimentações...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Configuração e Controle (Ordem hierárquica obrigatória) -->
    <script src="config.js"></script>
    <script src="extrato.js"></script>
</body>
</html>
