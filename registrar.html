<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças API - Cadastre-se</title>
    <!-- Bootstrap 5 CSS Local para estabilidade -->
    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">Criar Conta</h2>
            <p class="text-muted">Cadastre-se para gerenciar suas finanças</p>
        </div>

        <!-- Formulário de Registro -->
        <form id="formRegistrar">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
            </div>
            
            <!-- Mensagens dinâmicas de erro ou sucesso -->
            <div id="mensagemAlerta" class="alert d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Finalizar Cadastro</button>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted">Já tem uma conta? <a href="index.html" class="text-decoration-none">Faça login aqui</a></p>
        </div>
    </div>

    <!-- Script de Inteligência de Registro -->
    <script src="registrar.js"></script>
</body>
</html>
